  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

002Fstyle>\n<\u002Fhelmet>\n\n<header data-screen-label=\"Header\" style=\"position:sticky;top:0;z-index:50;background:rgba(248,250,252,0.85);backdrop-filter:blur(14px)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:32px;flex-wrap:wrap\">\n      <a href=\"#top\" style=\"display:flex;align-items:center\"><img src=\"342b009c-4f2c-4ba8-a99a-0024420de716\" alt=\"Buildy\" style=\"height:26px;width:auto;display:block\"><\u002Fa>\n      <nav style=\"display:flex;gap:2px;flex-wrap:wrap\">\n        <a href=\"#constructoras\" style=\"padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:#3C4A5E\" style-hover=\"color:#0F1B2D;background:#EEF2F7\">Constructoras<\u002Fa>\n        <a href=\"#proveedores\" style=\"padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:#3C4A5E\" style-hover=\"color:#0F1B2D;background:#EEF2F7\">Proveedores<\u002Fa>\n        <a href=\"#seguridad\" style=\"padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:#3C4A5E\" style-hover=\"color:#0F1B2D;background:#EEF2F7\">Seguridad y Pagos<\u002Fa>\n        <a href=\"#faq\" style=\"padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:#3C4A5E\" style-hover=\"color:#0F1B2D;background:#EEF2F7\">Precios<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;align-items:center\">\n      <a href=\"#\" style=\"padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:500;border:1px solid #CFD6E0;background:#fff;color:#0F1B2D\" style-hover=\"border-color:#1B365D;color:#1B365D\">Iniciar sesión<\u002Fa>\n      <a href=\"#registro\" style=\"padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:500;background:#1B365D;color:#fff;border:1px solid #1B365D\" style-hover=\"background:#142A4A;color:#fff\">Registrarse gratis<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n<section data-screen-label=\"Hero\" style=\"position:relative;overflow:hidden\">\n  <div style=\"position:absolute;left:38%;top:260px;width:760px;height:420px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(37,99,235,0.16),rgba(37,99,235,0.05) 55%,rgba(248,250,252,0) 100%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;left:62%;top:420px;width:720px;height:420px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(125,211,252,0.28),rgba(125,211,252,0.08) 55%,rgba(248,250,252,0) 100%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 24px 88px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n    <div style=\"display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid #E3E8EF;background:#fff;font-size:12.5px;font-weight:500;color:#3C4A5E\">\n      <span style=\"padding:2px 8px;border-radius:999px;background:#EAF1FE;color:#2563EB;font-family:'Geist Mono',monospace;font-size:11px\">Nuevo<\u002Fspan>\n      Comparativos automáticos para licitaciones de obra\n    <\u002Fdiv>\n    <h1 style=\"margin:24px 0 0;max-width:900px;font-size:clamp(34px,4.6vw,58px);line-height:1.06;letter-spacing:-0.035em;font-weight:500;color:#0F1B2D;text-wrap:balance\">La plataforma inteligente para gestionar suministros y adjudicaciones de obra con total garantía<\u002Fh1>\n    <p style=\"margin:20px 0 0;max-width:580px;font-size:17px;line-height:1.55;color:#5B6677;text-wrap:pretty\">Automatiza comparativos, blinda tus pagos y trabaja con proveedores verificados.<\u002Fp>\n\n    <div style=\"margin-top:40px;width:100%;max-width:760px;background:#fff;border:1px solid #E3E8EF;border-radius:22px;padding:8px;box-shadow:0 1px 2px rgba(15,27,45,0.04),0 24px 48px -24px rgba(27,54,93,0.22);display:flex;flex-wrap:wrap;gap:4px;text-align:lef ver=\"border-color:#fff;color:#fff\">Hablar con ventas<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer data-screen-label=\"Footer\" style=\"max-width:1200px;margin:0 auto;padding:40px 24px 32px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <a href=\"#top\"><img src=\"342b009c-4f2c-4ba8-a99a-0024420de716\" alt=\"Buildy\" style=\"height:24px;width:auto;display:block\"><\u002Fa>\n      <p style=\"margin:0;font-size:13px;line-height:1.6;color:#5B6677;max-width:220px\">Contratación, comparativos y pagos en garantía para la construcción.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px\">\n      <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8C97A8;margin-bottom:4px\">EMPRESAS<\u002Fdiv>\n      <a href=\"#\">Para constructoras<\u002Fa><a href=\"#\">Para proveedores<\u002Fa><a href=\"#\">Precios<\u002Fa><a href=\"#\">Hablar con ventas<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px\">\n      <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8C97A8;margin-bottom:4px\">RECURSOS<\u002Fdiv>\n      <a href=\"#\">Centro de ayuda<\u002Fa><a href=\"#\">Guía del escrow<\u002Fa><a href=\"#\">Blog de obra<\u002Fa><a href=\"#\">Plantillas de licitación<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px\">\n      <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8C97A8;margin-bottom:4px\">CATEGORÍAS POPULARES<\u002Fdiv>\n      <a href=\"#\">Hormigón y áridos<\u002Fa><a href=\"#\">Andamios<\u002Fa><a href=\"#\">Pladur y tabiquería<\u002Fa><a href=\"#\">Acero corrugado<\u002Fa><a href=\"#\">Alquiler de maquinaria<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px\">\n      <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#8C97A8;margin-bottom:4px\">LEGAL<\u002Fdiv>\n      <a href=\"#\">Aviso legal<\u002Fa><a href=\"#\">Privacidad<\u002Fa><a href=\"#\">Cookies<\u002Fa><a href=\"#\">Condiciones de uso<\u002Fa><a href=\"#\">Condiciones del escrow<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:48px;padding-top:20px;border-top:1px solid #E3E8EF;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#8C97A8\">\n    <span>© 2026 Buildy Technologies S.L.<\u002Fspan>\n    <span>Pagos procesados por Mangopay · Seguros por Hiscox<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;partnerLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;carrusel&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid'|'carrusel'&quot;},&quot;retentionPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:20,&quot;max&quot;:80,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;},&quot;faqMultiple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst MATERIALS = [[\"Hormigón HA-25\",148],[\"Hormigón bombeado\",96],[\"Andamios tubulares\",72],[\"Andamios multidireccionales\",41],[\"Pladur y tabiquería seca\",133],[\"Acero corrugado B500S\",88],[\"Áridos y gravas\",117],[\"Ladrillo cerámico\",64],[\"Alquiler de maquinaria\",152],[\"Impermeabilización\",58],[\"Aislamiento térmico\",77],[\"Encofrados\",49]];\nconst PROVINCES = [\"Madrid\",\"Barcelona\",\"Valencia\",\"Sevilla\",\"Málaga\",\"Alicante\",\"Bizkaia\",\"Zaragoza\",\"Murcia\",\"A Coruña\",\"Asturias\",\"Navarra\",\"Toledo\",\"Cádiz\",\"Baleares\"];\nconst PARTNERS = [[\"Hormigones Norte\",\"Hormigón\",\"Fabricante\",\"Norte peninsular\"],[\"Áridos Levante\",\"Áridos\",\"Distribuidor\",\"Comunidad Valenciana\"],[\"Aceros Castilla\",\"Acero\",\"Fabricante\",\"Castilla y León\"],[\"Yesos Ibérica\",\"Pladur\",\"Distribuidor oficial\",\"Nacional\"],[\"Andamios Tajo\",\"Andamios\",\"Alquiler y montaje\",\"Madrid · Toledo\"],[\"Cerámicas Duero\",\"Cerámica\",\"Fabricante\",\"Nacional\"],[\"Maderas Atlántico\",\"Madera\",\"Distribuidor\",\"Galicia · Asturias\"],[\"Aislatec Sur\",\"Aislamiento\",\"Distribuidor oficial\",\"Andalucía\"]];\nconst PCOLORS = [[\"#7DD3FC\",\"#2563EB\"],[\"#93B4F5\",\"#1B365D\"],[\"#7DD3FC\",\"#1B365D\"],[\"#BFD3FB\",\"#2563EB\"]];\nconst CHIPS = [[\"Hormigón HA-25 en Madrid\",\"Hormigón HA-25\",\"Madrid\"],[\"Andamios en Valencia\",\"Andamios tubulares\",\"Valencia\"],[\"Pladur en Barcelona\",\"Pladur y tabiquería seca\",\"Barcelona\"]];\nconst eur = n => n.toLocaleString(\"es-ES\",{minimumFractionDigits:2,maximumFractionDigits:2}) + \" €\";\n\nclass Component extends DCLogic {\n  state = { q: \"\", loc: \"\", focus: null, result: null, released: false, open: [0] };\n  runSearch(q, loc) {\n    const qn = q.trim().toLowerCase();\n    const m = MATERIALS.find(([n]) => n.toLowerCase().includes(qn));\n    const count = m && qn ? Math.max(3, Math.round(m[1] / (loc.trim() ? 6 : 1))) : 0;\n    this.setState({ q, loc, focus: null, result: count\n      ? `${count} proveedores verificados de ${m[0]}${loc ? \" en \" + loc : \" en España\"}`\n      : (qn ? \"Sin resultados exactos — publica una licitación y te encontramos proveedor\" : \"Escribe un material o servicio para buscar\") });\n  }\n  renderVals() {\n    const s = this.state, ret = this.props.retentionPct ?? 50, multi = this.props.faqMultiple ?? false;\n    const layout = this.props.partnerLayout ?? \"grid\";\n    const qn = s.q.trim().toLowerCase(), ln = s.loc.trim().toLowerCase();\n    const qList = MATERIALS.filter(([n]) => !qn || n.toLowerCase().includes(qn)).slice(0,5)\n      .map(([name,count]) => ({ name, count, pick: () => this.setState({ q: name, focus: null }) }));\n    const locList = PROVINCES.filter(p => !ln || p.toLowerCase().startsWith(ln)).slice(0,5)\n      .map(name => ({ name, pick: () => this.setState({ loc: name, focus: null }) }));\n    const total = 48600, releasedPct = s.released ? 100 : 100 - ret;\n    const faqsRaw = [\n      [\"¿Qué comisión cobra Buildy?\", \"Registrarse y publicar licitaciones es gratis para constructoras. El proveedor adjudicado paga una comisión del 2,5% sobre el importe liquidado, que incluye la custodia en escrow y la cobertura asociada. Sin cuotas fijas ni permanencia.\"],\n      [\"¿Cómo funciona exactamente el escrow?\", `Al adjudicar, el importe del pedido se deposita en una cuenta de custodia de Mangopay, entidad de dinero electrónico regulada. Se libera el ${100-ret}% al inicio del suministro y se retiene el ${ret}% restante hasta que el responsable de obra valida la entrega.`],\n      [\"¿En qué plazo se libera el pago?\", \"En cuanto se valida el albarán en obra, el importe retenido se transfiere automáticamente al proveedor en 24–48 horas hábiles. Si no hay validación ni incidencia en 7 días, se libera por defecto.\"],\n      [\"¿Qué cubre la garantía de Hiscox?\", \"La póliza de responsabilidad civil profesional cubre daños materiales y personales a terceros derivados de la ejecución de los pedidos adjudicados en Buildy, según las condiciones particulares de cada categoría.\"],\n      [\"¿Cómo se verifica a los proveedores?\", \"Comprobamos CIF, situación con Hacienda y Seguridad Social, seguros en vigor y certificados técnicos antes de que un proveedor pueda enviar ofertas.\"]\n    ];\n    const faqs = faqsRaw.map(([q,a],i) => {\n      const open = s.open.includes(i);\n      return { q, a, open, icon: open ? \"−\" : \"+\", iconBg: open ? \"#1B365D\" : \"#F1F5FB\", iconColor: open ? \"#fff\" : \"#1B365D\",\n        toggle: () => this.setState(st => ({ open: st.open.includes(i) ? st.open.filter(x => x !== i) : (multi ? [...st.open, i] : [i]) })) };\n    });\n    const partners = PARTNERS.map(([name,cat,type,zone],i) => ({ name, cat, type, zone, c1: PCOLORS[i%4][0], c2: PCOLORS[i%4][1] }));\n    const pc = s.pcat || \"Todos\";\n    const partnersShown = pc === \"Todos\" ? partners : partners.filter(p => p.cat === pc);\n    const pcats = [\"Todos\", ...PARTNERS.map(p => p[1])].map(label => { const on = label === pc; return { label, bg: on ? \"#1B365D\" : \"#fff\", color: on ? \"#fff\" : \"#3C4A5E\", border: on ? \"#1B365D\" : \"#E3E8EF\", pick: () => this.setState({ pcat: label }) }; });\n    return {\n      q: s.q, loc: s.loc, qList, locList, ret,\n      chips: CHIPS.map(([label,q,loc]) => ({ label, pick: () => this.runSearch(q, loc) })),\n      showQList: s.focus === \"q\" && qList.length > 0,\n      showLocList: s.focus === \"loc\" && locList.length > 0,\n      onQ: e => this.setState({ q: e.target.value, result: null }),\n      onLoc: e => this.setState({ loc: e.target.value, result: null }),\n      focusQ: () => this.setState({ focus: \"q\" }),\n      focusLoc: () => this.setState({ focus: \"loc\" }),\n      blur: () => setTimeout(() => this.setState({ focus: null }), 120),\n      search: () => this.runSearch(s.q, s.loc),\n      hasResult: !!s.result, resultText: s.result,\n      releasedW: releasedPct + \"%\",\n      releasedAmt: eur(total * releasedPct / 100),\n      heldAmt: eur(total * (100 - releasedPct) / 100),\n      statusText: s.released ? \"Liquidado\" : `${ret}% en custodia`,\n      statusBg: s.released ? \"#1B365D\" : \"#EAF1FE\", statusColor: s.released ? \"#fff\" : \"#2563EB\",\n      releaseBtn: s.released ? \"Reiniciar demostración\" : \"Validar entrega en obra →\",\n      toggleRelease: () => this.setState(st => ({ released: !st.released })),\n      faqs, partners, partnersShown, pcats,\n      offers: [[\"HN\",\"#2563EB\",\"Hormigones Norte\",\"18.240 €\",\"3 días\",\"4,9\",true],[\"AL\",\"#0EA5E9\",\"Áridos Levante\",\"19.980 €\",\"5 días\",\"4,7\",false],[\"AC\",\"#1B365D\",\"Aceros Castilla\",\"20.150 €\",\"4 días\",\"4,8\",false],[\"CD\",\"#64748B\",\"Cerámicas Duero\",\"21.410 €\",\"7 días\",\"4,5\",false]].map(([ini,color,name,price,plazo,rating,best]) => ({ ini, color, name, price, plazo, rating, best, rowBg: best ? \"#F1F6FF\" : \"#fff\" })),\n      bars: [18,26,22,34,30,44,38,52,40,36,58,70,48,62,56,74,66,88,72,60,82,94,78,100].map((h,i,a) => ({ h: h + \"%\", c: i === a.length - 1 ? \"#1B365D\" : (i % 3 === 0 ? \"#7DD3FC\" : \"#93B4F5\") })),\n      isGrid: layout === \"grid\", isCarousel: layout !== \"grid\",\n      marquee: React.createElement(\"div\", { style: { display: \"flex\", gap: 8, width: \"max-content\", animation: \"bd-marquee 36s linear infinite\" } },\n        [...partners, ...partners].map((p, i) => React.createElement(\"div\", { key: i, style: { width: 220, height: 96, flex: \"0 0 auto\", display: \"flex\", flexDirection: \"column\", alignItems: \"center\", justifyContent: \"center\", gap: 4, borderRadius: 16, border: \"1px solid #E3E8EF\", background: \"#fff\", color: \"#7A8698\" } },\n          React.createElement(\"span\", { style: { fontWeight: 600, fontSize: 16, letterSpacing: \"-0.02em\" } }, p.name),\n          React.createElement(\"span\", { style: { fontFamily: \"'Geist Mono',monospace\", fontSize: 10.5 } }, p.cat))))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
